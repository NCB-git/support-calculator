name: Deploy static site to Pages

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          path: _branches/main

      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: _branches/dev

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site/dev
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='README.md' _branches/main/ _site/
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='README.md' _branches/dev/ _site/dev/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
